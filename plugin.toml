id = "dan548.detekt-ktlint"
name = "detekt + ktlint"
version = "0.1.2"
description = "Checks Kotlin files on save and shows findings in the editor and Problems view. To get started, install either the detekt or ktlint CLI and grant it permission to run in Settings › Plugins. Quick fixes can suppress rules, and ktlint can format the current editor buffer."
icon = "icon.svg"
authors = ["dan548"]
homepage = "https://github.com/dan548/openidea-detekt-ktlint"
license = "Apache-2.0"
change-notes = "Adds Format Current File with ktlint with single-step Undo. Suppression quick fixes skip declarations inside comments and raw strings. Problems stay visible during an unchanged-file recheck, and detekt uses a fresh report. Adds a Marketplace icon and clearer setup instructions."
categories = ["linters"]
# plugin_dir and files-changed arrived in API 1.3. This package is built with
# the v0.1.47 SDK (openidea:plugin@1.10.0), so an older IDE cannot link it.
engines.openidea = "^1.10"
wasm = "dist/plugin.wasm"
activation = ["on-event:file-saved", "on-event:files-changed", "on-command:*"]

[capabilities]
required = ["project.read", "events", "storage", "editor.read", "editor.write"]
# Each tool is optional: with only one installed (`brew install detekt ktlint`)
# or granted, the other one is skipped.
optional = ["process:detekt", "process:ktlint"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["kotlin"]

[[contributes.commands]]
id = "check"
title = "detekt + ktlint: Check Current File"
category = "Kotlin Lint"

[[contributes.commands]]
id = "clear"
title = "detekt + ktlint: Clear Problems of Current File"
category = "Kotlin Lint"

[[contributes.commands]]
id = "format"
title = "Format Current File with ktlint"
category = "Kotlin Lint"

[contributes.settings]
title = "detekt + ktlint"
schema = "settings.schema.json"
