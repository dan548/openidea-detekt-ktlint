[package]
name = "openidea-plugin-dan548-detekt-ktlint"
version = "0.1.1"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "OpenIDEA plugin that checks Kotlin files with detekt and ktlint"

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK is not published to crates.io (`publish = false`). Community plugins
# pin the release tag of https://github.com/l0ng-ai/openidea, the same form
# `openidea-plugin new` writes. v0.1.47 is the latest stable release. Its WIT
# is openidea:plugin@1.10.0; plugin_dir and files-changed arrived in API 1.3.
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.47" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
